"❤️ Правильно.<br>А теперь осталось самое главное..."
];
function start(){show(0)}
function show(i){
 chapter=i;let c=chapters[i];app.className="card fade";
 app.innerHTML=`<div class="date">${c.date}</div><div class="progress"><div class="bar" style="width:${((i)/chapters.length)*100}%"></div></div>
 <h1>${c.title}</h1><p>${c.text}</p><div class="emoji">${c.emoji}</div>
 <div class="answers">${c.answers.map((x,n)=>`<button class="answer" onclick="answer(${n})">${x}</button>`).join("")}</div>
 <div id="message"></div><button class="next" id="next" onclick="goNext()">Следующая глава →</button>`;
}
function answer(n){
 let c=chapters[chapter],b=document.querySelectorAll(".answer"),m=document.getElementById("message");
 if(n===c.correct){b[n].classList.add("correct");b.forEach(x=>x.disabled=true);m.innerHTML=messages[chapter];document.getElementById("next").style.display="inline-block";}
 else{b[n].classList.add("wrong");m.innerHTML="Не угадала 😄 Попробуй ещё раз ❤️";setTimeout(()=>b[n].classList.remove("wrong"),350);}
}
function goNext(){
 if(chapter+1<chapters.length)show(chapter+1);
 else app.innerHTML=`<div class="date">ФИНАЛ · 29 СЕНТЯБРЯ 2026</div><h1>Ты дошла до конца ❤️</h1>
 <p>Но это не конец нашей истории.<br><br>Есть одна вещь, которая больше телефона, но меньше ноутбука. На ней можно играть, смотреть фильмы, обрабатывать фотографии и хранить новые воспоминания.<br><br><b>Что это?</b></p>
 <div class="emoji">🎁</div><button class="answer" onclick="finish()">Узнать последнюю подсказку →</button>`;
}
function finish(){app.innerHTML=`<div class="date">ПОСЛЕДНЯЯ ПОДСКАЗКА</div><h1>🎁 Для тебя</h1>
<p>Ты прошла нашу историю от одного 😉 до сегодняшнего дня.<br><br>Теперь оглянись вокруг и найди место, где тебя ждёт продолжение этой истории ❤️</p><div class="emoji">📱❤️</div>`;}
</script></body></html>
